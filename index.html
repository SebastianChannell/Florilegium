<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070606">
    <meta name="color-scheme" content="dark">
    <meta
      name="description"
      content="Domus is the quiet home of the Sacrum Florilegium projects."
    >
    <title>Domus · Sacrum Florilegium</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./assets/styles.css">
    <script type="module" src="./assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#project-list">Skip to projects</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Domus home">
          <span>Sacrum Florilegium</span>
          <strong>Domus</strong>
        </a>
        <p class="subtitle">A quiet house for prayer, study, and sacred reading.</p>
        <details class="florilegium-menu">
          <summary>
            <span>Sites</span>
            <span class="florilegium-menu-chevron" aria-hidden="true"></span>
          </summary>
          <nav aria-label="Sacrum Florilegium sites">
            <p>Sacrum Florilegium</p>
            <a href="https://sacrumflorilegium.com/" aria-current="page">Domus</a>
            <a href="https://biblia.sacrumflorilegium.com/">Biblia</a>
            <a href="https://librarium.sacrumflorilegium.com/">Librarium</a>
            <a href="https://officium.sacrumflorilegium.com/">Officium</a>
            <a href="https://orarium.sacrumflorilegium.com/">Orarium</a>
            <a href="https://propria.sacrumflorilegium.com/">Propria</a>
          </nav>
        </details>
      </header>

      <main>
        <section aria-labelledby="projects-heading">
          <h1 id="projects-heading" class="visually-hidden">Sacrum Florilegium projects</h1>

          <form id="search-form" class="search" role="search">
            <label class="visually-hidden" for="search-input">Search the house</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input
              id="search-input"
              name="q"
              type="search"
              inputmode="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search the house"
            >
          </form>

          <div class="browse-tools">
            <p id="result-count" class="result-count" aria-live="polite">Loading projects…</p>
          </div>

          <div id="status-message" class="status-message" role="status" aria-live="polite">
            <span class="loading-mark" aria-hidden="true"></span>
            <span>Opening the house…</span>
          </div>

          <ol id="project-list" class="project-list" aria-label="Projects" hidden></ol>
        </section>
      </main>

      <footer class="site-footer">
        <span aria-hidden="true">✠</span>
        <span>T.A.D.M.N.</span>
      </footer>
    </div>

    <noscript>
      <p class="noscript">JavaScript is required to open the project directory.</p>
    </noscript>
  </body>
</html>
